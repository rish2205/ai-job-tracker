spring.application.name=ai-job-tracker

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=ai_job_tracker;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Profile
spring.profiles.active=dev

ai.openai.api-key=${OPENAI_API_KEY}
ai.openai.url=https://api.openai.com/v1/responses
ai.openai.model=gpt-5.6-luna